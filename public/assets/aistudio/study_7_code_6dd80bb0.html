<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;

      -webkit-tap-highlight-color: transparent;

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md antialiased select-none">
<!-- Top App Header Section -->
<header class="fixed top-0 left-0 w-full z-40 bg-surface shadow-[0_2px_12px_rgba(22,27,45,0.03)]">
<div class="h-16 px-4 flex items-center justify-between">
<!-- Leading: Back Arrow -->
<button aria-label="返回题库" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Center: Progress Indicator Counter -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low border border-outline-variant/30">
<span class="material-symbols-outlined text-[16px] text-primary">edit_note</span>
<span class="font-title-sm text-title-sm text-on-surface font-semibold tracking-tight">第 <span class="text-primary font-bold text-title-md">3</span> / 20 题</span>
</div>
<!-- Trailing: Actions (Grid Answer Sheet & Bookmark) -->
<div class="flex items-center gap-1">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" title="答题卡">
<span class="material-symbols-outlined text-[22px]">grid_view</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" title="收藏本题">
<span class="material-symbols-outlined text-[22px]">bookmark_border</span>
</button>
</div>
</div>
<!-- Linear Progress Track (3 / 20 = 15%) -->
<div class="w-full h-1 bg-surface-container-high overflow-hidden">
<div class="h-full bg-primary transition-all duration-300 ease-out rounded-r-full" style="width: 15%;"></div>
</div>
</header>
<!-- Main Question Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-20 pb-36 px-4 md:px-6">
<!-- Metadata & Badges Hub -->
<div class="flex flex-wrap items-center justify-between gap-2.5 pt-3 pb-4">
<div class="flex flex-wrap items-center gap-2">
<!-- Chapter Tag -->
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-fixed text-label-md font-label-md">
<span class="material-symbols-outlined text-[14px] text-primary">topic</span>
          列车运行图
        </span>
<!-- Question Type Tag -->
<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-surface-container text-primary font-label-md text-label-md font-semibold border border-primary-fixed">
          单选题
        </span>
<!-- Difficulty Tag -->
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-mint-accent text-mint-text font-label-sm text-label-sm font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-mint-text"></span>
          简单
        </span>
</div>
<!-- Real-time Exam Timer -->
<div class="flex items-center gap-1 text-on-surface-variant bg-surface px-2.5 py-1 rounded-full border border-outline-variant/40 shadow-xs">
<span class="material-symbols-outlined text-[16px] text-primary">timer</span>
<span class="font-title-sm text-title-sm tracking-wider font-semibold">00:42</span>
</div>
</div>
<!-- Question Body Bento Surface -->
<section class="bg-surface rounded-2xl p-5 md:p-6 border border-[#E3E5EE] mb-5">
<div class="flex items-start gap-3">
<span class="shrink-0 mt-0.5 inline-flex items-center justify-center w-6 h-6 rounded-lg bg-primary-fixed text-primary font-title-sm text-title-sm font-bold">
          3
        </span>
<div class="space-y-2.5">
<h1 class="font-headline-sm text-headline-sm text-on-surface leading-snug font-semibold">
            铁路运输组织中列车运行图的基本作用是什么？
          </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
            请依据《铁路技术管理规程》及运输组织学基础原理，综合考量全路各部门协同作业机制，选择最核心的职能定位。
          </p>
</div>
</div>
</section>
<!-- Options List (Strictly Unanswered Initial State) -->
<section aria-label="选项列表" class="space-y-3">
<!-- Option A -->
<label class="group relative flex items-center justify-between p-4 bg-surface rounded-2xl border border-[#E3E5EE] hover:border-primary/40 active:scale-[0.99] transition-all cursor-pointer">
<input class="sr-only" name="exam_question_option" type="radio" value="A">
<div class="flex items-center gap-3.5 flex-1 pr-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center font-title-sm text-title-sm font-bold text-on-surface-variant shrink-0 group-hover:bg-secondary-container group-hover:text-primary transition-colors">
            A
          </div>
<span class="font-body-md text-body-md text-on-surface leading-relaxed">
            规定车站客货运费用的清算基准与计算方法
          </span>
</div>
<!-- Radio Hollow Circle Unselected -->
<div class="w-5 h-5 rounded-full border-2 border-outline-variant shrink-0 group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option B -->
<label class="group relative flex items-center justify-between p-4 bg-surface rounded-2xl border border-[#E3E5EE] hover:border-primary/40 active:scale-[0.99] transition-all cursor-pointer">
<input class="sr-only" name="exam_question_option" type="radio" value="B">
<div class="flex items-center gap-3.5 flex-1 pr-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center font-title-sm text-title-sm font-bold text-on-surface-variant shrink-0 group-hover:bg-secondary-container group-hover:text-primary transition-colors">
            B
          </div>
<span class="font-body-md text-body-md text-on-surface leading-relaxed">
            全路组织列车运行的基础，综合协调各部门作业的综合规划
          </span>
</div>
<!-- Radio Hollow Circle Unselected -->
<div class="w-5 h-5 rounded-full border-2 border-outline-variant shrink-0 group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option C -->
<label class="group relative flex items-center justify-between p-4 bg-surface rounded-2xl border border-[#E3E5EE] hover:border-primary/40 active:scale-[0.99] transition-all cursor-pointer">
<input class="sr-only" name="exam_question_option" type="radio" value="C">
<div class="flex items-center gap-3.5 flex-1 pr-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center font-title-sm text-title-sm font-bold text-on-surface-variant shrink-0 group-hover:bg-secondary-container group-hover:text-primary transition-colors">
            C
          </div>
<span class="font-body-md text-body-md text-on-surface leading-relaxed">
            仅用于记录列车在各区间实际行驶时间的统计图表
          </span>
</div>
<!-- Radio Hollow Circle Unselected -->
<div class="w-5 h-5 rounded-full border-2 border-outline-variant shrink-0 group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
<!-- Option D -->
<label class="group relative flex items-center justify-between p-4 bg-surface rounded-2xl border border-[#E3E5EE] hover:border-primary/40 active:scale-[0.99] transition-all cursor-pointer">
<input class="sr-only" name="exam_question_option" type="radio" value="D">
<div class="flex items-center gap-3.5 flex-1 pr-3">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center font-title-sm text-title-sm font-bold text-on-surface-variant shrink-0 group-hover:bg-secondary-container group-hover:text-primary transition-colors">
            D
          </div>
<span class="font-body-md text-body-md text-on-surface leading-relaxed">
            确定车站各类设备大修周期的工程维护计划表
          </span>
</div>
<!-- Radio Hollow Circle Unselected -->
<div class="w-5 h-5 rounded-full border-2 border-outline-variant shrink-0 group-hover:border-primary transition-colors flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
</div>
</label>
</section>
<!-- Warm Inline Tip (Unanswered Context - No Answer & No Explanation) -->

</main>
<!-- Bottom Fixed Task Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface z-40 border-t border-transparent shadow-[0_-4px_20px_rgba(22,27,45,0.06)] px-4 py-3 pb-safe">
<div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
<!-- Previous Question Button (Outlined Ergonomic Pill) -->
<button class="h-12 px-5 rounded-full border border-[#E3E5EE] hover:bg-surface-container-low text-on-surface font-title-sm text-title-sm font-semibold flex items-center gap-1.5 active:scale-95 transition-all shrink-0">
<span class="material-symbols-outlined text-[18px]">arrow_back_ios</span>
        上一题
      </button>
<!-- Submit Answer Button (Primary Action - Initial Unselected State) -->
<button class="h-12 flex-1 rounded-full bg-primary-fixed text-primary font-title-sm text-title-sm font-semibold flex items-center justify-center gap-2 active:scale-[0.98] transition-all cursor-pointer hover:bg-primary hover:text-on-primary">
<span class="">提交答案</span>
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
</div>
</footer>


</body></html>
