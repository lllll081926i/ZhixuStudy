<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;

    }

      background-color: #F8F9FD;
      border-color: #C7C5D4;

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-secondary-container selection:text-primary">
<!-- Top App Bar (Task-Focused / Linear Practice Mode) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-surface">
<!-- Left: Back Button & Context Identity -->
<div class="flex items-center gap-3">
<button aria-label="返回上一级" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-baseline gap-2">
<span class="font-title-lg text-title-lg text-on-surface tracking-tight font-bold">5</span>
<span class="font-label-md text-label-md text-outline">/ 20 题</span>
</div>
</div>
<!-- Center/Right Action Toolbar: Timer, Bookmark & Answer Sheet -->
<div class="flex items-center gap-1.5 sm:gap-2">
<!-- Mini Timer Chip -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] text-primary">schedule</span>
<span class="tracking-wider tabular-nums font-medium">01:15</span>
</div>
<!-- Bookmark (收藏) -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" title="收藏此题" type="button">
<span class="material-symbols-outlined text-[22px]">bookmark_border</span>
</button>
<!-- Answer Sheet (答题卡) -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all" title="答题卡" type="button">
<span class="material-symbols-outlined text-[22px]">grid_view</span>
</button>
</div>
</header>
<!-- Progress Bar (Thin serene accent line) -->
<div class="fixed top-16 left-0 w-full h-[3px] bg-surface-variant/40 z-40">
<div class="h-full bg-primary-container transition-all duration-300" style="width: 25%;"></div>
</div>
<!-- Main Question Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto px-4 pt-24 pb-28 flex flex-col justify-start">
<!-- Meta Tags & Classification Bar -->
<div class="flex flex-wrap items-center gap-2 mb-4">
<!-- Category Tag -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface custom-border text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[15px] text-primary">train</span>
<span class="">车流组织与调度</span>
</div>
<!-- Question Type Badge -->
<div class="inline-flex items-center px-2.5 py-1 rounded-full bg-secondary-container text-primary font-label-md text-label-md font-semibold">
        判断题
      </div>
<!-- Difficulty Chip -->
<div class="inline-flex items-center px-2.5 py-1 rounded-full bg-mint-accent text-mint-text font-label-md text-label-md font-medium">
        简单
      </div>
</div>
<!-- Question Stem Card (Tier 1 Surface) -->
<section class="bg-surface rounded-xl custom-border p-5 sm:p-6 mb-5 relative transition-shadow">
<div class="flex items-start gap-3">
<span class="mt-0.5 inline-flex items-center justify-center w-6 h-6 rounded-lg bg-surface-container text-primary font-title-sm text-title-sm shrink-0 font-bold">
          5
        </span>
<div class="space-y-3">
<p class="font-title-lg text-title-lg text-on-surface leading-relaxed tracking-normal font-semibold">
            铁路车流组织中，重车流与空车流必须严格按照列车编组计划组织挂运，各技术站无权擅自变更运行经路。
          </p>
<div class="flex items-center gap-2 font-label-sm text-label-sm text-outline pt-1">
<span class="">分值：2.0 分</span>
<span class="">•</span>
<span class="">单项判断</span>
</div>
</div>
</div>
</section>
<!-- Judgment Options Zone (Initial Neutral Unselected State) -->
<section class="mb-5">
<h2 class="sr-only">判断题选项</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
<!-- Option A: 正确 (True) - Neutral Idle State -->
<label class="group relative flex items-center justify-between p-4 sm:p-5 bg-surface rounded-xl custom-border cursor-pointer transition-all duration-150 hover-subtle active:scale-[0.98]">
<input class="sr-only peer" name="judgment_question_5" type="radio" value="TRUE">
<div class="flex items-center gap-3.5">
<!-- Neutral Option Identifier Letter -->
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant font-title-sm text-title-sm font-semibold group-hover:bg-secondary-container group-hover:text-primary transition-colors">
              A
            </div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">正确</span>
<span class="font-label-sm text-label-sm text-outline">True</span>
</div>
</div>
<!-- Neutral Outline Icon Container -->
<div class="w-9 h-9 rounded-full custom-border flex items-center justify-center text-outline group-hover:text-primary group-hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">check</span>
</div>
</label>
<!-- Option B: 错误 (False) - Neutral Idle State -->
<label class="group relative flex items-center justify-between p-4 sm:p-5 bg-surface rounded-xl custom-border cursor-pointer transition-all duration-150 hover-subtle active:scale-[0.98]">
<input class="sr-only peer" name="judgment_question_5" type="radio" value="FALSE">
<div class="flex items-center gap-3.5">
<!-- Neutral Option Identifier Letter -->
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant font-title-sm text-title-sm font-semibold group-hover:bg-secondary-container group-hover:text-primary transition-colors">
              B
            </div>
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">错误</span>
<span class="font-label-sm text-label-sm text-outline">False</span>
</div>
</div>
<!-- Neutral Outline Icon Container -->
<div class="w-9 h-9 rounded-full custom-border flex items-center justify-center text-outline group-hover:text-primary group-hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[20px]">close</span>
</div>
</label>
</div>
</section>
<!-- Contextual Guidance / Serene Prompt Message -->

</main>
<!-- Sticky Practice Bottom Operational Bar (Task-Focused / Linear Flow) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface z-40 py-3 px-4 shadow-[0_-4px_16px_rgba(36,40,59,0.04)]">
<div class="max-w-2xl mx-auto flex items-center justify-between gap-4">
<!-- Left: Previous Question Button (Secondary Outlined / Tonal) -->
<button class="h-12 px-5 rounded-full custom-border bg-surface text-on-surface font-label-lg text-label-lg flex items-center gap-1.5 hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_left</span>
<span class="">上一题</span>
</button>
<!-- Center Utilities (Quick Skip or Scratchpad toggle) -->
<div class="flex items-center gap-2">
<button class="h-12 px-3 rounded-full text-on-surface-variant font-label-md text-label-md flex items-center gap-1 hover:bg-surface-container active:scale-95 transition-all" title="标记为待复查" type="button">
<span class="material-symbols-outlined text-[18px]">flag</span>
<span class="hidden sm:inline">标记待查</span>
</button>
</div>
<!-- Right: Submit Answer Button (Primary Container Pill) -->
<button class="h-12 px-7 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center gap-1.5 shadow-[0_4px_12px_rgba(98,105,200,0.24)] hover:opacity-95 active:scale-95 transition-all" type="button">
<span class="">提交答案</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</footer>


</body></html>
